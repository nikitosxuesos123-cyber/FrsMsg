name: Build FRSGRAM APK

on:
  push:
    branches: [ main ]
    paths:
      - 'FRSGRAM-source.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack FRSGRAM source
        run: unzip -q -o FRSGRAM-source.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install stable Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Patch project for API 36 and compile fixes
        shell: bash
        run: |
          set -euxo pipefail

          BUILD_FILE="FRSGRAM/app/build.gradle.kts"
          CHAT_FILE="FRSGRAM/app/src/main/java/com/FrosvanDevelop/Frsgram/feature/chat/ChatScreen.kt"
          ROOT_FILE="FRSGRAM/app/src/main/java/com/FrosvanDevelop/Frsgram/navigation/FrsgramRoot.kt"

          # Stable API 36 dependency set.
          sed -i 's/compileSdk = 37/compileSdk = 36/' "$BUILD_FILE"
          sed -i 's/androidx.core:core-ktx:1.19.0/androidx.core:core-ktx:1.17.0/' "$BUILD_FILE"
          sed -i 's/androidx.lifecycle:lifecycle-runtime-compose:2.11.0/androidx.lifecycle:lifecycle-runtime-compose:2.10.0/' "$BUILD_FILE"
          sed -i 's/androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0/androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0/' "$BUILD_FILE"
          sed -i 's/androidx.hilt:hilt-navigation-compose:1.4.0/androidx.hilt:hilt-navigation-compose:1.3.0/' "$BUILD_FILE"

          # Fix actual Kotlin compile errors found in run #6.
          sed -i 's/FrsColors.SecondaryBackground/FrsColors.Background2/g' "$CHAT_FILE"
          sed -i 's/onDone = { nav.navigate(Routes.ProfileSetup)/onContinueToProfile = { nav.navigate(Routes.ProfileSetup)/' "$ROOT_FILE"

          # clickable is an extension; import it and call it on the receiver.
          if ! grep -q '^import androidx.compose.foundation.clickable$' "$CHAT_FILE"; then
            sed -i '/^import androidx.compose.foundation.background$/a import androidx.compose.foundation.clickable' "$CHAT_FILE"
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path("FRSGRAM/app/src/main/java/com/FrosvanDevelop/Frsgram/feature/chat/ChatScreen.kt")
          s = p.read_text()
          old = '''private fun Modifier.clickableNoRipple(onClick: () -> Unit): Modifier = androidx.compose.foundation.clickable(
              interactionSource = MutableInteractionSource(), indication = null, onClick = onClick,
          )'''
          new = '''private fun Modifier.clickableNoRipple(onClick: () -> Unit): Modifier = this.clickable(
              interactionSource = MutableInteractionSource(), indication = null, onClick = onClick,
          )'''
          if old not in s:
              raise SystemExit("clickableNoRipple block not found")
          p.write_text(s.replace(old, new))
          PY

          echo "----- Build config -----"
          grep -E 'compileSdk|core-ktx|lifecycle-runtime-compose|lifecycle-viewmodel-compose|hilt-navigation-compose' "$BUILD_FILE"
          echo "----- Compile fixes -----"
          grep -nE 'Background2|onContinueToProfile|clickableNoRipple' "$CHAT_FILE" "$ROOT_FILE" | tail -20

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle -p FRSGRAM :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FRSGRAM-debug-apk
          path: FRSGRAM/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
