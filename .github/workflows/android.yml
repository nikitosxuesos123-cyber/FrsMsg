name: Build FRSGRAM APK

on:
  push:
    branches: [ main ]
    paths:
      - 'FRSGRAM-source.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack FRSGRAM source
        run: unzip -q -o FRSGRAM-source.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK and licenses
        uses: android-actions/setup-android@v3

      - name: Install official Android CLI
        shell: bash
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install_root.sh | bash
          android --version

      - name: Install Android 17 platform
        shell: bash
        run: |
          set -euxo pipefail
          android --sdk="$ANDROID_HOME" sdk install platforms/android-37 --canary
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"
          ls -la "$ANDROID_HOME/platforms/android-37"

      - name: Install stable build tools
        run: sdkmanager 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle -p FRSGRAM :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FRSGRAM-debug-apk
          path: FRSGRAM/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
