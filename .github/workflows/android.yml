name: Build FRSGRAM APK

on:
  push:
    branches: [ main ]
    paths:
      - 'FRSGRAM-source.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack FRSGRAM source
        run: unzip -q -o FRSGRAM-source.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install stable Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Patch AndroidX versions for API 36
        shell: bash
        run: |
          set -euxo pipefail

          sed -i 's/compileSdk = 37/compileSdk = 36/' FRSGRAM/app/build.gradle.kts

          sed -i 's/androidx.core:core-ktx:1.19.0/androidx.core:core-ktx:1.17.0/'             FRSGRAM/app/build.gradle.kts

          sed -i 's/androidx.lifecycle:lifecycle-runtime-compose:2.11.0/androidx.lifecycle:lifecycle-runtime-compose:2.10.0/'             FRSGRAM/app/build.gradle.kts

          sed -i 's/androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0/androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0/'             FRSGRAM/app/build.gradle.kts

          sed -i 's/androidx.hilt:hilt-navigation-compose:1.4.0/androidx.hilt:hilt-navigation-compose:1.3.0/'             FRSGRAM/app/build.gradle.kts

          echo "----- Patched build.gradle.kts -----"
          grep -E 'compileSdk|core-ktx|lifecycle-runtime-compose|lifecycle-viewmodel-compose|hilt-navigation-compose'             FRSGRAM/app/build.gradle.kts

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle -p FRSGRAM :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FRSGRAM-debug-apk
          path: FRSGRAM/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
